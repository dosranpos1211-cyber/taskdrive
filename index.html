<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>タスクドライブ</title>
  <meta name="theme-color" content="#141414">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="タスクドライブ">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #141414;
      color: #f0bc39;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      overflow: hidden;
    }
    #app {
      position: fixed;
      top: 0;
      left: 0;
      box-sizing: border-box;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      border: 0;
      background: #141414;
      display: block;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #141414;
      transition: opacity .3s ease;
      z-index: 1;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading img { width: 96px; height: 96px; }
    #loading p { margin: 0; font-size: 14px; letter-spacing: .05em; opacity: .85; }
    #fallback {
      display: none;
      padding: 12px 24px;
      border-radius: 999px;
      background: #f0bc39;
      color: #141414;
      font-weight: 700;
      text-decoration: none;
    }
    #fallback.show { display: inline-block; }
  </style>
</head>
<body>
  <iframe id="app" title="タスクドライブ"></iframe>
  <div id="loading" role="status" aria-live="polite">
    <img src="icons/icon-192.png" alt="タスクドライブ">
    <p id="loading-msg">読み込み中…</p>
    <a id="fallback" target="_blank" rel="noopener">ブラウザで開く</a>
  </div>
  <script id="token-keeper">
    // ログイン状態の預かり（v3.8.1）
    // スマホでは埋め込んだツールの中の保存が起動のたびに消えることがあるため、ログイン状態（トークン）を
    // このページ（ホーム画面から開く入口）の保存領域に預かり、ツールに頼まれたら返す。
    // 答える相手：GAS の画面（*-script.googleusercontent.com）で、しかもこのページの iframe の中にいるものだけ。
    var TaskDriveTokenKeeper = (function () {
      var SANDBOX_ORIGIN = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
      var TOKEN_FORMAT = /^[0-9a-f]{64}$/;   // src/Auth.js の newToken_ と同じ形（16 進 64 文字）
      var NONCE_FORMAT = /^[0-9a-f]{8,64}$/;
      var KEY = 'taskdrive.token';

      function readToken(storage) {
        try {
          var t = storage.getItem(KEY);
          return typeof t === 'string' && TOKEN_FORMAT.test(t) ? t : '';
        } catch (e) {
          return '';
        }
      }

      // 届いたメッセージを処理し、返事が要るときは返事を返す（要らない・受け付けないときは null）
      function handle(data, origin, storage) {
        if (typeof origin !== 'string' || !SANDBOX_ORIGIN.test(origin)) return null;
        if (!data || typeof data !== 'object' || typeof data.type !== 'string' || data.type.indexOf('taskdrive:') !== 0) return null;
        if (data.type === 'taskdrive:getToken') {
          if (typeof data.nonce !== 'string' || !NONCE_FORMAT.test(data.nonce)) return null;
          return { type: 'taskdrive:token', token: readToken(storage), nonce: data.nonce };
        }
        if (data.type === 'taskdrive:setToken') {
          var t = data.token;
          try {
            if (t === '' || t == null) storage.removeItem(KEY);
            else if (typeof t === 'string' && TOKEN_FORMAT.test(t)) storage.setItem(KEY, t);
          } catch (e) { /* 保存できない環境では預からない */ }
        }
        return null;
      }

      // source が root（このページの iframe）の中の画面か（ほかのサイトが開いた窓などには答えない）
      function isInside(root, source, depth) {
        if (!root || !source) return false;
        if (root === source) return true;
        if (depth <= 0) return false;
        try {
          for (var i = 0; i < root.length; i++) {
            if (isInside(root[i], source, depth - 1)) return true;
          }
        } catch (e) { /* 読めない枠は対象外 */ }
        return false;
      }

      return { handle: handle, isInside: isInside, SANDBOX_ORIGIN: SANDBOX_ORIGIN, TOKEN_FORMAT: TOKEN_FORMAT };
    })();

    window.addEventListener('message', function (event) {
      // ほかのサイトに埋め込まれているときは何もしない
      if (window.top !== window) return;
      var frame = document.getElementById('app');
      if (!frame || !TaskDriveTokenKeeper.isInside(frame.contentWindow, event.source, 5)) return;
      var storage = null;
      try { storage = window.localStorage; } catch (e) { /* 使えない */ }
      var reply = TaskDriveTokenKeeper.handle(event.data, event.origin, storage);
      if (reply) event.source.postMessage(reply, event.origin);
    });
  </script>
  <script>
    (function () {
      // ツールの URL（変わったらここだけ書き換える）
      var APP_URL = 'https://script.google.com/macros/s/AKfycbyadB91DUuflMVUlH6eQnfEekpBQizEm-mG5S4eGXET8puUNKtY0awOBm2cQ56-eSAJ/exec';
      var frame = document.getElementById('app');
      var loading = document.getElementById('loading');
      var fallback = document.getElementById('fallback');
      var loaded = false;

      fallback.href = APP_URL;
      frame.addEventListener('load', function () {
        if (!frame.getAttribute('src')) return;
        loaded = true;
        loading.className = 'hidden';
      });
      frame.setAttribute('src', APP_URL);

      // 15 秒たっても表示されないときは、ブラウザで開くボタンを出す
      setTimeout(function () {
        if (loaded) return;
        document.getElementById('loading-msg').textContent = '表示に時間がかかっています';
        fallback.className = 'show';
      }, 15000);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function () { /* 使えなくても動く */ });
        });
      }
    })();
  </script>
</body>
</html>
