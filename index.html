<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>タスクドライブ</title>
  <meta name="theme-color" content="#141414">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="タスクドライブ">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #141414;
      color: #f0bc39;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      overflow: hidden;
    }
    #app {
      position: fixed;
      top: 0;
      left: 0;
      box-sizing: border-box;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      border: 0;
      background: #141414;
      display: block;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #141414;
      transition: opacity .3s ease;
      z-index: 1;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading img { width: 96px; height: 96px; }
    #loading p { margin: 0; font-size: 14px; letter-spacing: .05em; opacity: .85; }
    #fallback {
      display: none;
      padding: 12px 24px;
      border-radius: 999px;
      background: #f0bc39;
      color: #141414;
      font-weight: 700;
      text-decoration: none;
    }
    #fallback.show { display: inline-block; }
  </style>
</head>
<body>
  <iframe id="app" title="タスクドライブ"></iframe>
  <div id="loading" role="status" aria-live="polite">
    <img src="icons/icon-192.png" alt="タスクドライブ">
    <p id="loading-msg">読み込み中…</p>
    <a id="fallback" target="_blank" rel="noopener">ブラウザで開く</a>
  </div>
  <script>
    (function () {
      // ツールの URL（変わったらここだけ書き換える）
      var APP_URL = 'https://script.google.com/macros/s/AKfycbyadB91DUuflMVUlH6eQnfEekpBQizEm-mG5S4eGXET8puUNKtY0awOBm2cQ56-eSAJ/exec';
      var frame = document.getElementById('app');
      var loading = document.getElementById('loading');
      var fallback = document.getElementById('fallback');
      var loaded = false;

      fallback.href = APP_URL;
      frame.addEventListener('load', function () {
        if (!frame.getAttribute('src')) return;
        loaded = true;
        loading.className = 'hidden';
      });
      frame.setAttribute('src', APP_URL);

      // 15 秒たっても表示されないときは、ブラウザで開くボタンを出す
      setTimeout(function () {
        if (loaded) return;
        document.getElementById('loading-msg').textContent = '表示に時間がかかっています';
        fallback.className = 'show';
      }, 15000);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function () { /* 使えなくても動く */ });
        });
      }
    })();
  </script>
</body>
</html>
